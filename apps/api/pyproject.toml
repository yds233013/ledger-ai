[project]
name = "ledgerai-api"
version = "0.1.0"
description = "Ledger AI backend — FastAPI + SQLAlchemy + RQ"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "greenlet>=3.1",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.20",
    # RS256 verification of Clerk session tokens. PyJWT ships PyJWKClient but
    # cannot verify an asymmetric signature without this — installed here
    # rather than as pyjwt[crypto] so the dependency is visible in this list.
    "pyjwt>=2.10",
    "cryptography>=44.0",
    # Verifies the Svix signature Clerk puts on webhooks. Signature checking is
    # exactly the code not to hand-roll.
    "svix>=1.45",
    # Exact pin: this is the client that revokes a Clerk identity during account
    # deletion. A surprise upgrade there is a surprise in the deletion path.
    "httpx==0.28.1",
    "bcrypt>=4.2",
    "redis>=5.2",
    "rq>=2.0",
    "boto3>=1.35",
    "filetype>=1.2",
    "pillow>=11.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    # OCR: pytesseract wraps the tesseract binary; pypdfium2 rasterizes PDFs
    # with no system dependency (poppler is not required) under a permissive
    # licence, unlike PyMuPDF's AGPL.
    "pytesseract>=0.3.13",
    "pypdfium2>=4.30",
    "rapidfuzz>=3.10",
    # Optional AI. Never required: the app is fully functional with no key.
    "openai>=1.60",
]

# Installed into the virtualenv's bin directory, which is on PATH inside the
# image. These are the commands a scheduler runs; the repo-root scripts/
# directory does not exist in a deployed container.
[project.scripts]
ledgerai-worker = "ledgerai.worker:main"
ledgerai-demo-cleanup = "ledgerai.cli:demo_cleanup_main"
ledgerai-retention-sweep = "ledgerai.cli:retention_sweep_main"
ledgerai-backfill-categories = "ledgerai.cli:backfill_categories_main"
ledgerai-invite = "ledgerai.cli:invite_main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.14",
    "types-pyyaml",
    "types-boto3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ledgerai"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "N", "W"]
ignore = ["S101", "B008"]  # assert in tests; FastAPI Depends() in defaults

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"alembic/*" = ["N999", "E501"]
# The seed and sample generators use a seeded PRNG on purpose: the demo data
# must be byte-identical on every machine. It is not cryptographic material.
"../../scripts/*" = ["S311"]
# Same reason. These fabricate transaction amounts and dates for synthetic
# datasets — nothing here is a secret, and where unpredictability actually
# matters (the demo seed, the account address, the password hash) the values
# come from `secrets`, not from `random`.
"ledgerai/services/demo_data.py" = ["S311"]
"ledgerai/services/demo.py" = ["S311"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
